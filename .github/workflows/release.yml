name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

# A UI-created release fires both events for the same tag; serialize them.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: card-finders-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
