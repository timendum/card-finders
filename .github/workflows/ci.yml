name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  backend:
    name: Backend checks
    # Same-repo PR branches are already covered by their push run; only run
    # the pull_request event for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Test
        run: go test ./...
      - name: Format check
        run: "! gofmt -l . | grep ."

  frontend:
    name: Frontend checks and build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run oxlint
      - name: Stylelint
        run: bun run stylelint "src/**/*.css"
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Format check
        run: bun run oxfmt --check .
      - name: Build
        run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  package:
    name: Package ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build and bundle
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="$(git describe --tags --always --dirty)"
          name="card-finders-${version}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "dist/${name}"
          (cd backend && go build -trimpath -ldflags "-s -w -X main.version=${version}" \
            -o "../dist/${name}/server${{ matrix.ext }}" ./cmd/server)
          cp -r frontend/dist "dist/${name}/static"
          cp levels.toml README.md INSTALL.md GAME.md "dist/${name}/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "${name}.zip" "${name}"
          else
            tar -czf "${name}.tar.gz" "${name}"
          fi
          echo "ARCHIVE=dist/${name}.${{ matrix.archive }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: card-finders-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
